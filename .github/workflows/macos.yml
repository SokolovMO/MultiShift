name: MultiShift checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-macos.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.lock -r requirements.txt
      - name: Python checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Native core checks
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/multishift-swiftpm"
      - name: Build and self-test
        run: bash scripts/build_macos.sh
