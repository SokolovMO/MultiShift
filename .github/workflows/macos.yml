name: MultiShift checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-macos.lock
            requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.lock -r requirements.txt
      - name: Python checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Native core checks
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/multishift-swiftpm"
      - name: Build and self-test
        run: bash scripts/build_macos.sh
