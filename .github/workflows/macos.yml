name: MultiShift macOS checks and release

on:
  push:
    branches: [main]
    tags: ["v*", "beta-v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: multishift-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  macos:
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'multishift-release' || 'ci' }}
    env:
      MULTISHIFT_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/beta-v') && 'beta' || 'stable' }}
      MULTISHIFT_ENABLE_UPDATES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      MULTISHIFT_SPARKLE_PUBLIC_KEY: ${{ vars.MULTISHIFT_SPARKLE_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check exact main CI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/check_release_source.py

      - name: Validate release tag and reviewed source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYCODE'
          import os
          from scripts.prepare_candidate import metadata
          version, build = metadata("MultiShift")
          tag = os.environ["TAG"]
          expected = f"{'beta-v' if tag.startswith('beta-') else 'v'}{version}-build{build}"
          if tag != expected:
              raise SystemExit(f"Expected {expected}")
          PYCODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-macos.lock -r requirements.txt

      - name: Run checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Run native core tests
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/multishift-swiftpm"

      - name: Prepare verified updater framework
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/prepare_sparkle.sh

      - name: Build MultiShift.app
        env:
          MULTISHIFT_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: |
          bash scripts/build_macos.sh

      - name: Smoke-test app identity and behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="dist/MultiShift.app"
          "$APP/Contents/MacOS/MultiShift" --selftest
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'com.multiswitcher.multishift'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Contents/Info.plist" | grep -Fx 'multishift'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" | grep -Fx '14.0'

      - name: Require release credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Cannot publish an unsigned build: required secret $name is missing."
              exit 1
            fi
          done

      - name: Sign, notarize, and package the release DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="dist/MultiShift.app"
          KEYCHAIN="$RUNNER_TEMP/multishift.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/multishift.p12"
          PROFILE="multishift-notary"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
          }
          trap cleanup EXIT

          xattr -dr com.apple.FinderInfo "$APP" 2>/dev/null || true
          xattr -dr com.apple.ResourceFork "$APP" 2>/dev/null || true
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          xcrun notarytool store-credentials "$PROFILE" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$KEYCHAIN"

          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              codesign --force --timestamp --options runtime --preserve-metadata=identifier,entitlements --sign "$MACOS_SIGN_IDENTITY" "$file"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          while IFS= read -r bundle; do
            codesign --force --timestamp --options runtime --preserve-metadata=identifier,entitlements --sign "$MACOS_SIGN_IDENTITY" "$bundle"
          done < <(find "$APP/Contents/Frameworks" -depth \( -name '*.xpc' -o -name '*.app' -o -name '*.framework' \) -type d)
          codesign --force --timestamp --options runtime --entitlements installer/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$file"
            fi
          done < <(find "$APP/Contents" -type f -print0)

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/MultiShift.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MultiShift.zip" --keychain-profile "$PROFILE" \
            --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          mkdir -p dist/dmg
          ditto "$APP" dist/dmg/MultiShift.app
          ln -s /Applications dist/dmg/Applications
          DMG="dist/MultiShift-mac-${{ matrix.arch }}.dmg"
          hdiutil create -volname MultiShift -srcfolder dist/dmg -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --keychain-profile "$PROFILE" --keychain "$KEYCHAIN" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Attach immutable identity and corresponding source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'from dragshift import __version__; print(__version__)')
          BUILD=$(cat macos/build-number.txt)
          CHANNEL=stable
          if [[ "$TAG" == beta-* ]]; then CHANNEL=beta; fi
          python3 scripts/release_manifest.py create --app MultiShift --version "$VERSION" --build "$BUILD" --commit "$GITHUB_SHA" --channel "$CHANNEL" --minimum-os 14.0 --updater-key "$MULTISHIFT_SPARKLE_PUBLIC_KEY" --artifact dist/MultiShift-mac-apple-silicon.dmg > dist/manifest.json
          git archive --format=tar.gz --output=dist/source.tar.gz HEAD dragshift macos scripts installer licenses requirements.txt requirements-macos.lock engine_main.py DragShift.spec LICENSE UPSTREAM-LICENSE-MIT THIRD-PARTY-NOTICES.md README.md
          cp LICENSE THIRD-PARTY-NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MultiShift-mac-${{ matrix.arch }}
          path: |
            dist/MultiShift-mac-${{ matrix.arch }}.dmg
            dist/MultiShift-mac-${{ matrix.arch }}.dmg.sha256
            dist/manifest.json
            dist/source.tar.gz
            dist/LICENSE
            dist/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  publish:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release checksums
        run: |
          find release -name '*.dmg' -print0 | xargs -0 shasum -a 256 > release/SHA256SUMS
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: MultiShift ${{ github.ref_name }}
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'beta-') }}
          make_latest: false
          generate_release_notes: true
          body: |
            MultiShift for macOS, built from `${{ github.sha }}`.

            The Apple Silicon build passed the repository checks and was signed and notarized before publication. Minimum supported macOS: 14.

            Verify downloads with `SHA256SUMS`.
          files: |
            release/**/*.dmg
            release/SHA256SUMS
            release/**/manifest.json
            release/**/source.tar.gz
            release/**/LICENSE
            release/**/THIRD-PARTY-NOTICES.md
          fail_on_unmatched_files: true
