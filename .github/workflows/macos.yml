name: MultiShift checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-macos.lock
            requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.lock -r requirements.txt
      - name: Python checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Native core checks
        run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/multishift-swiftpm"
      - name: Build and self-test
        run: bash scripts/build_macos.sh
