name: Предложение / Feature request
description: Опишите задачу, которую MultiShift может упростить / Describe a workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Задача и проблема / Workflow and problem
      description: What are you trying to do, and where does the current behavior get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение / Proposed behavior
      description: Describe the desired result and any alternatives you tried.
    validations:
      required: true
