name: Feature request / Предложение
description: Describe a workflow that MultiShift could improve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem / Задача и проблема
      description: What are you trying to do, and where does the current behavior get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Предложение
      description: Describe the desired result and any alternatives you tried.
    validations:
      required: true
