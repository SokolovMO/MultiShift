name: Ошибка / Bug report
description: Сообщите о воспроизводимой проблеме / Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "English / русский welcome. Use synthetic files. Security issues: see SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Версия и окружение / Version and environment
      description: MultiShift version/build, macOS version, Mac chip, and installation method.
      placeholder: "0.4.1 (11), macOS ..., Apple Silicon, DMG"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги / Steps to reproduce
      description: Include input format and chosen action. Attach only safe synthetic examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло / Actual behavior
      description: Include the error text or a redacted screenshot if helpful.
    validations:
      required: true
